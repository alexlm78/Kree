# /etc/nginx/sites-available/kree.kreaker.net
# Static Leptos CSR site (trunk build --release -> dist/)
server {
    listen 80;
    listen [::]:80;
    server_name kree.kreaker.net;

    root /var/www/kree;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml application/json;
    gzip_min_length 1024;

    # trunk emits content-hashed js/wasm (kree-web-<hash>.js): safe to cache forever.
    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(svg|ico|png)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: /downloads, deep links, refresh -> index.html (router handles 404 page)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# After first enable, run:  sudo certbot --nginx -d kree.kreaker.net
# certbot rewrites this block to add the 443 server + http->https redirect.
